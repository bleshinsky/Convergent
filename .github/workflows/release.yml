name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -noEmit -skipLibCheck

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: node esbuild.config.mjs production

      - name: Get version from manifest
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> $GITHUB_OUTPUT

      - name: Create release archive
        run: |
          mkdir -p release
          cp main.js styles.css manifest.json release/
          cd release && zip ../convergent-${{ steps.version.outputs.version }}.zip main.js styles.css manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Convergent v${{ steps.version.outputs.version }}
          body: |
            ## Convergent v${{ steps.version.outputs.version }}

            See [CHANGELOG.md](https://github.com/bleshinsky/Convergent/blob/master/CHANGELOG.md) for details.

            ### Installation
            1. Download `convergent-${{ steps.version.outputs.version }}.zip`
            2. Extract to your vault's `.obsidian/plugins/convergent/` folder
            3. Enable the plugin in Obsidian Settings → Community Plugins
          files: |
            convergent-${{ steps.version.outputs.version }}.zip
            main.js
            manifest.json
            styles.css
          draft: false
          prerelease: false
