name: Build & Test

on:
  push:
    branches: [master, main, 'claude/**']
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -noEmit -skipLibCheck

      - name: Run unit tests
        run: npm test

      - name: Build plugin
        run: node esbuild.config.mjs production

      - name: Verify output files
        run: |
          test -f main.js || (echo "main.js not found!" && exit 1)
          test -f styles.css || (echo "styles.css not found!" && exit 1)
          test -f manifest.json || (echo "manifest.json not found!" && exit 1)
          echo "Build artifacts verified ✓"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build
          path: |
            main.js
            styles.css
            manifest.json
